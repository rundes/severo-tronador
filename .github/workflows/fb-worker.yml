name: FB worker (páginas/grupos públicos → listening_items)

# Scrapea las páginas/grupos de Facebook configurados en listening_config
# (URLs de facebook.com dentro de rss_feeds) hacia listening_items.
# Mismos riesgos documentados que x-worker: ToS, cuenta quemable, IP de
# datacenter. Ver infra/fb-worker/README.md.
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (ya existen).
# Opcional: FB_WORKER_COOKIES (cookies.txt de cuenta quemable).

on:
  schedule:
    # 2 corridas diarias, offset de x-worker (10:07/22:07) y demás crons.
    - cron: "37 11,23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fb-worker
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FB_COOKIES: ${{ secrets.FB_WORKER_COOKIES }}
      POSTS_PAGES: "2"
      DELAY_SECONDS: "60"
      COMMENTS_PER_POST: "20"
    steps:
      - name: Verificar secrets
        id: gate
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL no configurado — skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/fb-worker/requirements.txt

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        working-directory: infra/fb-worker
        run: pip install -r requirements.txt

      - name: Correr worker
        if: steps.gate.outputs.run == 'true'
        working-directory: infra/fb-worker
        run: python -u worker.py
