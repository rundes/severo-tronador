name: X worker (twscrape → listening_items)

# Corre el worker de timelines de X en GitHub Actions en vez de la PC del
# operador. Trae los últimos tweets de cada handle (incluye cuentas chicas que
# la sindicación gratis no cubre) y los escribe en listening_items.
#
# ⚠️ Riesgos conocidos (los mismos que en la PC, más uno):
#  - Scraping con cuenta logueada viola ToS de X → usar cuenta QUEMABLE.
#  - Los runners de Actions tienen IP de datacenter: X puede bloquear/limitar
#    más agresivo que con IP residencial. Si la cuenta empieza a fallar acá,
#    volver a correrlo local (run.cmd) sigue funcionando igual.
#
# Secrets requeridos (Settings → Secrets and variables → Actions):
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY  (ya existen para otros workflows)
#   X_WORKER_USERNAME, X_WORKER_EMAIL, X_WORKER_AUTH_TOKEN, X_WORKER_CT0
# Si X_WORKER_AUTH_TOKEN no está seteado, el job termina sin hacer nada.

on:
  schedule:
    # 2 corridas diarias, offset de los otros crons de escucha.
    - cron: "7 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-worker
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: infra/twikit-worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      X_USERNAME: ${{ secrets.X_WORKER_USERNAME }}
      X_EMAIL: ${{ secrets.X_WORKER_EMAIL }}
      X_AUTH_TOKEN: ${{ secrets.X_WORKER_AUTH_TOKEN }}
      X_CT0: ${{ secrets.X_WORKER_CT0 }}
      TWEETS_PER_HANDLE: "5"
      DELAY_SECONDS: "30"
    steps:
      - name: Verificar secrets
        id: gate
        run: |
          if [ -z "$X_AUTH_TOKEN" ]; then
            echo "X_WORKER_AUTH_TOKEN no configurado — skip."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/twikit-worker/requirements.txt

      # accounts.db guarda la sesión de twscrape entre corridas (cache mutable:
      # clave única por run + restore de la más reciente).
      - name: Restaurar sesión twscrape
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: infra/twikit-worker/accounts.db
          key: twscrape-accounts-${{ github.run_id }}
          restore-keys: twscrape-accounts-

      - name: Instalar dependencias
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Correr worker
        if: steps.gate.outputs.run == 'true'
        run: python -u worker.py

      - name: Guardar sesión twscrape
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v4
        with:
          path: infra/twikit-worker/accounts.db
          key: twscrape-accounts-${{ github.run_id }}
