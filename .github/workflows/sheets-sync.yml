name: Trigger sheets-sync cron

# Drena sheets_sync_queue hacia el espejo de Google Sheets. El cron de Vercel
# (1/día por límite de Hobby) quedaba corto: una campaña de 1.300 envíos
# tardaba semanas en espejarse. Cada 15 min alcanza sin pegar contra el rate
# limit de la Sheets API.
#
# Requisitos: mismo CRON_SECRET/APP_URL que los otros workflows.

on:
  schedule:
    - cron: "8/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheets-sync
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit /api/cron/sheets-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://severo-tronador.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret no configurado en el repo"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/sheets-sync")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::endpoint devolvió $code"
            exit 1
          fi

  alerta:
    needs: trigger
    if: failure()
    uses: ./.github/workflows/cron-alert.yml
    with:
      job: sheets-sync
    permissions:
      contents: read
      issues: write
