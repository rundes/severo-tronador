<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { font: 14px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 560px;
         margin: 40px auto; color: #18181b; padding: 0 16px; }
  @media (prefers-color-scheme: dark) { body { color: #f4f4f5; background: #09090b; } }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
          color: #71717a; margin: 14px 0 4px; }
  input { width: 100%; padding: 7px 10px; border: 1px solid #d4d4d8; border-radius: 6px;
          font: inherit; background: inherit; color: inherit; box-sizing: border-box; }
  button { margin-top: 16px; padding: 7px 18px; border: 0; border-radius: 6px;
           background: #4f5bd5; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #status { margin-top: 10px; font-size: 13px; min-height: 18px; }
  .ok { color: #059669; } .err { color: #dc2626; }
  p.help { color: #71717a; font-size: 13px; }
</style>
</head>
<body>
  <h1 style="font-size:18px">Tronador Monitor — Opciones</h1>
  <p class="help">El token se genera en la app: Escucha → Informe → "Generar token de extensión" (rol owner).</p>
  <label for="appUrl">URL de la app</label>
  <input id="appUrl" placeholder="https://severo-tronador.vercel.app">
  <label for="token">Token del proyecto</label>
  <input id="token" placeholder="proyecto.secreto">
  <label for="hora">Hora del barrido diario (abre las búsquedas)</label>
  <input id="hora" type="time" value="09:00">
  <button id="guardar">Guardar y probar</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
